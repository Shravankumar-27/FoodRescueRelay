# RescueRelay: optional PostgreSQL + backend + frontend stack.
# Run with: docker compose up --build
# Without Docker, the app defaults to local SQLite (see backend/.env.example).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rescuerelay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rescuerelay}
      POSTGRES_DB: ${POSTGRES_DB:-rescuerelay}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rescuerelay -d rescuerelay"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://rescuerelay:rescuerelay@db:5432/rescuerelay
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the environment or a .env file at the repo root}
      CORS_ORIGINS: http://localhost:5173
      DEMO_MODE: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    environment:
      RESCUERELAY_API_TARGET: ${RESCUERELAY_API_TARGET:-http://backend:8000}
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
